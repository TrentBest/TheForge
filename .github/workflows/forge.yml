name: Forge

on:
  push:
    branches:
      - master
      - "forge/**"
      - "mvp/**"
  pull_request:
    branches:
      - master
      - "forge/**"
      - "mvp/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore tests/TheSingularityWorkshop.Forge.Tests/TheSingularityWorkshop.Forge.Tests.csproj
      - name: Build
        run: dotnet build tests/TheSingularityWorkshop.Forge.Tests/TheSingularityWorkshop.Forge.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/TheSingularityWorkshop.Forge.Tests/TheSingularityWorkshop.Forge.Tests.csproj --configuration Release --no-build
